kind: UDSBundle
metadata:
  name: szl-fleet-overlay
  description: "UDS Core plus five flagship Package registrations and the Defensive Control Plane workload"
  version: "0.2.0"
  # Doctrine: v11 LOCKED 749/14/163 at kernel commit c7c0ba17 | SLSA L1

packages:
  # Phase 1: UDS Core prerequisite.
  - name: core
    repository: ghcr.io/defenseunicorns/packages/uds/core
    # Upstream flavor; no alternate registry provenance is claimed.
    ref: "1.5.0-upstream"
    overrides:
      istio-admin-gateway:
        gateway:
          values:
            - path: "service.annotations"
              value: {}
      istio-tenant-gateway:
        gateway:
          values:
            - path: "service.annotations"
              value: {}

  # Phase 2: local fleet overlay.
  - name: szl-fleet-overlay
    path: "."
    ref: "0.2.0"
