# yaml-language-server: $schema=https://raw.githubusercontent.com/zarf-dev/zarf/main/zarf.schema.json
# SZL Fleet Overlay — Pure Zarf variant
# Doctrine v11 LOCKED 749/14/163 at kernel commit c7c0ba17

kind: ZarfPackageConfig
metadata:
  name: szl-fleet-overlay
  description: "SZL Fleet UDS Package Overlay — registers all SZL flagships as UDS-managed applications with doctrine-pinned receipts"
  version: "0.2.0"
  vendor: "SZL Holdings"
  url: "https://github.com/szl-holdings/szl-fleet-overlay"
  yolo: false

constants:
  - name: DOCTRINE_VERSION
    value: "v11"
  - name: DOCTRINE_PIN
    value: "749/14/163"
  - name: KERNEL_COMMIT
    value: "c7c0ba17"
  - name: SLSA_LEVEL
    value: "L1"
  - name: DCP_VERSION
    value: "0.4.0"
  - name: DCP_SOURCE_REVISION
    value: "cbb7bddf0b584987830617e68725e36e9ed27434"
  - name: DCP_IMAGE_DIGEST
    value: "sha256:01f1fa2d3a4eb3cffb873f7393b64050df77f4383fa9d219163fa0be0bd6dce6"

variables:
  - name: DOMAIN
    description: "UDS cluster domain"
    default: "uds.dev"
  - name: SSO_GROUP
    description: "Keycloak group gate"
    default: "/szl-operators"

components:
  - name: szl-namespaces
    required: true
    description: "Create SZL application namespaces"
    manifests:
      - name: szl-namespaces
        files:
          - configs/namespaces.yaml
    actions:
      onDeploy:
        after:
          - wait:
              cluster:
                kind: Namespace
                name: szl-a11oy
                condition: Exists
          - wait:
              cluster:
                kind: Namespace
                name: szl-defensive-control-plane
                condition: Exists

  - name: szl-a11oy-package
    required: true
    description: "UDS Package CR for a11oy"
    manifests:
      - name: szl-a11oy-package
        namespace: szl-a11oy
        files:
          - configs/packages/package-a11oy.yaml

  - name: szl-sentra-package
    required: true
    description: "UDS Package CR for sentra"
    manifests:
      - name: szl-sentra-package
        namespace: szl-sentra
        files:
          - configs/packages/package-sentra.yaml

  - name: szl-amaru-package
    required: true
    description: "UDS Package CR for amaru"
    manifests:
      - name: szl-amaru-package
        namespace: szl-amaru
        files:
          - configs/packages/package-amaru.yaml

  - name: szl-rosie-package
    required: true
    description: "UDS Package CR for rosie"
    manifests:
      - name: szl-rosie-package
        namespace: szl-rosie
        files:
          - configs/packages/package-rosie.yaml

  - name: szl-killinchu-package
    required: true
    description: "UDS Package CR for killinchu"
    manifests:
      - name: szl-killinchu-package
        namespace: szl-killinchu
        files:
          - configs/packages/package-killinchu.yaml

  - name: szl-defensive-control-plane-package
    required: true
    description: "UDS network contract for the Defensive Control Plane"
    manifests:
      - name: szl-defensive-control-plane-package
        namespace: szl-defensive-control-plane
        files:
          - configs/packages/package-defensive-control-plane.yaml

  - name: szl-defensive-control-plane-workload
    required: true
    description: "Single-writer SZL Defensive Control Plane v0.4.0 workload"
    manifests:
      - name: szl-defensive-control-plane-workload
        namespace: szl-defensive-control-plane
        files:
          - configs/workloads/defensive-control-plane.yaml
    images:
      - ghcr.io/szl-holdings/szl-defensive-control-plane@sha256:01f1fa2d3a4eb3cffb873f7393b64050df77f4383fa9d219163fa0be0bd6dce6

  - name: szl-peat-mesh-nodes
    required: false
    default: true
    description: "Peat mesh node configs for CRDT-based state sync"
    manifests:
      - name: szl-peat-nodes
        files:
          - configs/peat/peat-node-a11oy.yaml
          - configs/peat/peat-node-sentra.yaml
          - configs/peat/peat-node-amaru.yaml
          - configs/peat/peat-node-rosie.yaml
          - configs/peat/peat-node-killinchu.yaml

  - name: szl-doctrine-receipts
    required: true
    description: "Doctrine pin and deterministic checksum manifest; outer Zarf package is signed in CI"
    files:
      - source: receipts/checksums.txt
        target: /var/szl/receipts/checksums.txt
      - source: receipts/doctrine-pin.yaml
        target: /var/szl/receipts/doctrine-pin.yaml
