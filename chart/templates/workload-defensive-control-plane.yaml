{{- if .Values.apps.defensiveControlPlane.enabled }}
{{- $app := .Values.apps.defensiveControlPlane }}
{{- $repository := required "apps.defensiveControlPlane.image.repository is required" $app.image.repository }}
{{- $digest := required "apps.defensiveControlPlane.image.digest is required" $app.image.digest }}
{{- $signingSecret := required "apps.defensiveControlPlane.signingSecretName is required" $app.signingSecretName }}
{{- if not (regexMatch "^sha256:[0-9a-f]{64}$" $digest) }}
{{- fail "apps.defensiveControlPlane.image.digest must be sha256:<64 lowercase hex>" }}
{{- end }}
{{- if ne $digest "sha256:01f1fa2d3a4eb3cffb873f7393b64050df77f4383fa9d219163fa0be0bd6dce6" }}
{{- fail "apps.defensiveControlPlane.image.digest must match the signed v0.4.0 release subject" }}
{{- end }}
{{- if ne $repository "ghcr.io/szl-holdings/szl-defensive-control-plane" }}
{{- fail "apps.defensiveControlPlane.image.repository must be the canonical SZL repository" }}
{{- end }}
{{- if not (regexMatch "^[0-9a-f]{40}$" $app.image.sourceRevision) }}
{{- fail "apps.defensiveControlPlane.image.sourceRevision must be a 40-character lowercase Git SHA" }}
{{- end }}
{{- if ne $app.image.sourceRevision "cbb7bddf0b584987830617e68725e36e9ed27434" }}
{{- fail "apps.defensiveControlPlane.image.sourceRevision must match the signed v0.4.0 source" }}
{{- end }}
{{- if ne $app.image.version "0.4.0" }}
{{- fail "apps.defensiveControlPlane.image.version must be 0.4.0 for this overlay release" }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: szl-defensive-control-plane
  namespace: {{ $app.namespace }}
  labels:
    app: szl-defensive-control-plane
automountServiceAccountToken: false
{{- with $app.imagePullSecretName }}
imagePullSecrets:
  - name: {{ . }}
{{- end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: szl-defensive-control-plane-data
  namespace: {{ $app.namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    app: szl-defensive-control-plane
    app.kubernetes.io/name: szl-defensive-control-plane
    app.kubernetes.io/version: {{ $app.image.version | quote }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- with $app.persistence.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $app.persistence.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: szl-defensive-control-plane
  namespace: {{ $app.namespace }}
  labels:
    app: szl-defensive-control-plane
    app.kubernetes.io/name: szl-defensive-control-plane
    app.kubernetes.io/version: {{ $app.image.version | quote }}
  annotations:
    szl.io/doctrine-version: {{ .Values.global.doctrinePinVersion | quote }}
    szl.io/doctrine-pin: {{ .Values.global.doctrinePinRef | quote }}
    szl.io/kernel-commit: {{ .Values.global.kernelCommit | quote }}
    szl.io/source-revision: {{ $app.image.sourceRevision | quote }}
    szl.io/image-digest: {{ $digest | quote }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: szl-defensive-control-plane
  template:
    metadata:
      labels:
        app: szl-defensive-control-plane
        app.kubernetes.io/name: szl-defensive-control-plane
        app.kubernetes.io/version: {{ $app.image.version | quote }}
    spec:
      serviceAccountName: szl-defensive-control-plane
      automountServiceAccountToken: false
      {{- with $app.imagePullSecretName }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: defensive-control-plane
          image: {{ printf "%s@%s" $repository $digest | quote }}
          imagePullPolicy: {{ $app.image.pullPolicy }}
          args:
            - serve
            - --db
            - /data/control-plane.sqlite3
            - --mode
            - cluster-readonly
            - --host
            - 0.0.0.0
            - --port
            - "8080"
          env:
            - name: DCP_EVENT_ROOT_KEY_HEX
              valueFrom:
                secretKeyRef:
                  name: {{ $signingSecret }}
                  key: event-root-key-hex
                  optional: false
            - name: DCP_EVIDENCE_KEY_HEX
              valueFrom:
                secretKeyRef:
                  name: {{ $signingSecret }}
                  key: evidence-key-hex
                  optional: false
            - name: DCP_TRUSTED_HOSTS
              value: >-
                szl-defensive-control-plane,
                szl-defensive-control-plane.{{ $app.namespace }},
                szl-defensive-control-plane.{{ $app.namespace }}.svc,
                szl-defensive-control-plane.{{ $app.namespace }}.svc.cluster.local
            - name: TMPDIR
              value: /tmp
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /livez
              port: http
              httpHeaders:
                - name: Host
                  value: szl-defensive-control-plane
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /livez
              port: http
              httpHeaders:
                - name: Host
                  value: szl-defensive-control-plane
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
              httpHeaders:
                - name: Host
                  value: szl-defensive-control-plane
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            {{- toYaml $app.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: szl-defensive-control-plane-data
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: szl-defensive-control-plane
  namespace: {{ $app.namespace }}
  labels:
    app: szl-defensive-control-plane
    app.kubernetes.io/name: szl-defensive-control-plane
spec:
  type: ClusterIP
  selector:
    app: szl-defensive-control-plane
  ports:
    - name: http
      port: {{ $app.servicePort }}
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: szl-defensive-control-plane-default-deny
  namespace: {{ $app.namespace }}
  labels:
    app: szl-defensive-control-plane
spec:
  podSelector:
    matchLabels:
      app: szl-defensive-control-plane
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
  egress: []
{{- end }}
