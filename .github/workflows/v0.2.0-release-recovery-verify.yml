name: v0.2.0 Release Recovery Verification

on:
  workflow_dispatch: {}

permissions:
  contents: read
  packages: read

concurrency:
  group: v0.2.0-release-recovery-verification
  cancel-in-progress: false

env:
  EXPECTED_TAG: v0.2.0
  EXPECTED_TAG_OBJECT: f129627959a97881108251b4cdc855fd1c84c5fb
  EXPECTED_TARGET: dc79a3c85fc5089b7ddd4e38bc3cf7f0dfe61e04
  EXPECTED_RELEASE_ID: "373686079"
  EXPECTED_OCI_REF: oci://ghcr.io/szl-holdings/packages/szl-fleet-overlay:0.2.0
  EXPECTED_OCI_IMAGE_REF: ghcr.io/szl-holdings/packages/szl-fleet-overlay:0.2.0
  EXPECTED_OCI_DIGEST: sha256:6863a08ebe082a54875032386b502c528adfb190388efe29c5c79934053254b2
  PKG_FILE: zarf-package-szl-fleet-overlay-amd64-0.2.0.tar.zst
  PKG_SHA256: e91b4f19dd5c5d8710c6a52c4a33261410bc47d5bd58935f5869efc384574df5
  PKG_BUNDLE_SHA256: 6586d02ebbecd0fb284c7bf4c0669765ce2c34a1aadd33a773e0e43f19e05929
  SBOM_BUNDLE_SHA256: 96ea7c69a0209817a15b0af71f79a433b602b914fa1d62675078170951531ce6
  SBOM_FILE: zarf-package-szl-fleet-overlay-amd64-0.2.0.sbom.spdx.json
  SBOM_SHA256: cd1f5862937c3a7cce68bca05886d34e471293a7d260042d087bdf9fb2017dec
  ZARF_VERSION: v0.77.0
  ZARF_LINUX_AMD64_SHA256: 7e335ffe9861d6ce254d75b31fde9c96c0fa83469c82cd20228b27e63d18dd85
  CERTIFICATE_IDENTITY: >-
    https://github.com/szl-holdings/szl-fleet-overlay/.github/workflows/zarf-package-sign.yml@refs/tags/v0.2.0
  CERTIFICATE_ISSUER: https://token.actions.githubusercontent.com

jobs:
  verify-existing-release:
    name: Verify existing v0.2.0 draft and OCI bytes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require current protected main and exact signed tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "${GITHUB_SHA}"
          git merge-base --is-ancestor "${EXPECTED_TARGET}" "${GITHUB_SHA}"

          tag_object=$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/git/ref/tags/${EXPECTED_TAG}" \
            --jq '.object.sha')
          test "${tag_object}" = "${EXPECTED_TAG_OBJECT}"

          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" > tag.json
          jq -e \
            --arg target "${EXPECTED_TARGET}" \
            '.object.type == "commit" and
             .object.sha == $target and
             .verification.verified == true and
             .verification.reason == "valid"' tag.json >/dev/null

      - name: Require the exact unpublished draft and four assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/releases/${EXPECTED_RELEASE_ID}" > release.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          release = json.loads(Path("release.json").read_text(encoding="utf-8"))
          expected = {
              os.environ["PKG_FILE"]: (
                  522168205,
                  91805562,
                  "sha256:" + os.environ["PKG_SHA256"],
              ),
              os.environ["PKG_FILE"] + ".cosign.bundle": (
                  522168200,
                  9089,
                  "sha256:" + os.environ["PKG_BUNDLE_SHA256"],
              ),
              os.environ["PKG_FILE"] + ".sbom.bundle": (
                  522168207,
                  132393,
                  "sha256:" + os.environ["SBOM_BUNDLE_SHA256"],
              ),
              os.environ["SBOM_FILE"]: (
                  522168203,
                  68945,
                  "sha256:" + os.environ["SBOM_SHA256"],
              ),
          }
          if release.get("id") != int(os.environ["EXPECTED_RELEASE_ID"]):
              raise SystemExit("draft release id changed")
          if release.get("draft") is not True or release.get("published_at") is not None:
              raise SystemExit("release is not the expected unpublished draft")
          if release.get("prerelease") is not False:
              raise SystemExit("unexpected prerelease state")
          if release.get("tag_name") != os.environ["EXPECTED_TAG"]:
              raise SystemExit("draft tag changed")
          if release.get("target_commitish") != os.environ["EXPECTED_TARGET"]:
              raise SystemExit("draft target changed")
          assets = release.get("assets")
          if not isinstance(assets, list) or len(assets) != len(expected):
              raise SystemExit("draft does not have exactly four assets")
          actual = {}
          for asset in assets:
              name = asset.get("name")
              if name in actual:
                  raise SystemExit(f"duplicate draft asset: {name}")
              actual[name] = (asset.get("id"), asset.get("size"), asset.get("digest"))
              if asset.get("state") != "uploaded":
                  raise SystemExit(f"draft asset is not uploaded: {name}")
          if actual != expected:
              raise SystemExit(f"draft asset metadata changed: {actual!r}")
          with Path("asset-map.tsv").open("w", encoding="utf-8", newline="\n") as handle:
              for asset in sorted(assets, key=lambda item: item["name"]):
                  handle.write(f"{asset['id']}\t{asset['name']}\n")
          PY

          mkdir -p dist
          while IFS=$'\t' read -r asset_id asset_name; do
            gh api \
              -H "Accept: application/octet-stream" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
              > "dist/${asset_name}"
          done < asset-map.tsv

          printf '%s  %s\n' "${PKG_SHA256}" "dist/${PKG_FILE}" | sha256sum --check --strict
          printf '%s  %s\n' "${PKG_BUNDLE_SHA256}" "dist/${PKG_FILE}.cosign.bundle" \
            | sha256sum --check --strict
          printf '%s  %s\n' "${SBOM_BUNDLE_SHA256}" "dist/${PKG_FILE}.sbom.bundle" \
            | sha256sum --check --strict
          printf '%s  %s\n' "${SBOM_SHA256}" "dist/${SBOM_FILE}" | sha256sum --check --strict

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.3

      - name: Verify the staged package signature and SBOM attestation
        run: |
          set -euo pipefail
          package="dist/${PKG_FILE}"
          sbom="dist/${SBOM_FILE}"
          bundle="dist/${PKG_FILE}.sbom.bundle"

          cosign verify-blob \
            --bundle "dist/${PKG_FILE}.cosign.bundle" \
            --certificate-identity "${CERTIFICATE_IDENTITY}" \
            --certificate-oidc-issuer "${CERTIFICATE_ISSUER}" \
            "${package}"
          cosign verify-blob-attestation \
            --bundle "${bundle}" \
            --certificate-identity "${CERTIFICATE_IDENTITY}" \
            --certificate-oidc-issuer "${CERTIFICATE_ISSUER}" \
            --type spdxjson \
            "${package}"

          PKG="${package}" SBOM="${sbom}" BUNDLE="${bundle}" python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path


          def reject_nonfinite(value: str) -> None:
              raise ValueError(f"non-finite JSON value: {value}")


          def load_json_bytes(raw: bytes):
              return json.loads(raw, parse_constant=reject_nonfinite)


          package_path = Path(os.environ["PKG"])
          sbom_path = Path(os.environ["SBOM"])
          bundle_path = Path(os.environ["BUNDLE"])
          bundle = load_json_bytes(bundle_path.read_bytes())
          encoded_envelope = bundle.get("base64Signature")
          if not isinstance(encoded_envelope, str) or not encoded_envelope:
              raise SystemExit("SBOM bundle does not contain a legacy DSSE envelope")
          envelope = load_json_bytes(base64.b64decode(encoded_envelope, validate=True))
          if envelope.get("payloadType") != "application/vnd.in-toto+json":
              raise SystemExit("unexpected DSSE payload type")
          signatures = envelope.get("signatures")
          if not isinstance(signatures, list) or len(signatures) != 1:
              raise SystemExit("expected exactly one DSSE signature")
          encoded_statement = envelope.get("payload")
          if not isinstance(encoded_statement, str) or not encoded_statement:
              raise SystemExit("DSSE envelope has no statement payload")
          statement = load_json_bytes(base64.b64decode(encoded_statement, validate=True))
          sbom = load_json_bytes(sbom_path.read_bytes())
          package_digest = hashlib.sha256()
          with package_path.open("rb") as package_file:
              for chunk in iter(lambda: package_file.read(1024 * 1024), b""):
                  package_digest.update(chunk)
          expected_subject = [{
              "name": package_path.name,
              "digest": {"sha256": package_digest.hexdigest()},
          }]
          if statement.get("_type") != "https://in-toto.io/Statement/v0.1":
              raise SystemExit("unexpected in-toto statement type")
          if statement.get("predicateType") != "https://spdx.dev/Document":
              raise SystemExit("unexpected SBOM predicate type")
          if statement.get("subject") != expected_subject:
              raise SystemExit("SBOM attestation subject does not bind the exact package")
          if statement.get("predicate") != sbom:
              raise SystemExit("signed SBOM predicate differs from the staged SPDX document")
          PY

      - name: Install checksum-pinned Zarf
        run: |
          set -euo pipefail
          url="https://github.com/zarf-dev/zarf/releases/download/${ZARF_VERSION}/zarf_${ZARF_VERSION}_Linux_amd64"
          curl -fSL --retry 3 --retry-delay 5 "${url}" -o /usr/local/bin/zarf
          printf '%s  %s\n' "${ZARF_LINUX_AMD64_SHA256}" /usr/local/bin/zarf \
            | sha256sum --check --strict
          chmod +x /usr/local/bin/zarf
          file /usr/local/bin/zarf | grep -q ELF
          zarf version

      - name: Log in to GHCR for exact package readback
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify exact OCI digest and byte-for-byte package parity
        run: |
          set -euo pipefail
          manifest=$(docker buildx imagetools inspect "${EXPECTED_OCI_IMAGE_REF}")
          printf '%s\n' "${manifest}"
          digest=$(awk '$1 == "Digest:" { print $2; exit }' <<<"${manifest}")
          test "${digest}" = "${EXPECTED_OCI_DIGEST}"

          pulled=false
          for attempt in 1 2 3 4 5; do
            rm -rf oci-readback
            mkdir -p oci-readback
            if zarf package pull "${EXPECTED_OCI_REF}" \
              --architecture amd64 \
              --output-directory oci-readback; then
              pulled=true
              break
            fi
            if [ "${attempt}" -lt 5 ]; then
              sleep "$((attempt * 3))"
            fi
          done
          test "${pulled}" = "true"

          oci_package=$(find oci-readback -maxdepth 1 -type f \
            -name "${PKG_FILE}" -print -quit)
          test -n "${oci_package}"
          test "$(find oci-readback -maxdepth 1 -type f -name 'zarf-package-*.tar.zst' | wc -l)" -eq 1
          printf '%s  %s\n' "${PKG_SHA256}" "${oci_package}" | sha256sum --check --strict
          cmp --silent "dist/${PKG_FILE}" "${oci_package}"
          cosign verify-blob \
            --bundle "dist/${PKG_FILE}.cosign.bundle" \
            --certificate-identity "${CERTIFICATE_IDENTITY}" \
            --certificate-oidc-issuer "${CERTIFICATE_ISSUER}" \
            "${oci_package}"
          cosign verify-blob-attestation \
            --bundle "dist/${PKG_FILE}.sbom.bundle" \
            --certificate-identity "${CERTIFICATE_IDENTITY}" \
            --certificate-oidc-issuer "${CERTIFICATE_ISSUER}" \
            --type spdxjson \
            "${oci_package}"

      - name: Revalidate unchanged draft after OCI verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/releases/${EXPECTED_RELEASE_ID}" > release-final.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          release = json.loads(Path("release-final.json").read_text(encoding="utf-8"))
          expected = {
              os.environ["PKG_FILE"]: (
                  522168205,
                  91805562,
                  "sha256:" + os.environ["PKG_SHA256"],
              ),
              os.environ["PKG_FILE"] + ".cosign.bundle": (
                  522168200,
                  9089,
                  "sha256:" + os.environ["PKG_BUNDLE_SHA256"],
              ),
              os.environ["PKG_FILE"] + ".sbom.bundle": (
                  522168207,
                  132393,
                  "sha256:" + os.environ["SBOM_BUNDLE_SHA256"],
              ),
              os.environ["SBOM_FILE"]: (
                  522168203,
                  68945,
                  "sha256:" + os.environ["SBOM_SHA256"],
              ),
          }
          if release.get("id") != int(os.environ["EXPECTED_RELEASE_ID"]):
              raise SystemExit("draft release id changed after OCI verification")
          if release.get("draft") is not True or release.get("published_at") is not None:
              raise SystemExit("release state changed after OCI verification")
          if release.get("tag_name") != os.environ["EXPECTED_TAG"]:
              raise SystemExit("draft tag changed after OCI verification")
          if release.get("target_commitish") != os.environ["EXPECTED_TARGET"]:
              raise SystemExit("draft target changed after OCI verification")
          assets = release.get("assets")
          if not isinstance(assets, list) or len(assets) != len(expected):
              raise SystemExit("draft asset count changed after OCI verification")
          actual = {}
          for asset in assets:
              name = asset.get("name")
              if name in actual:
                  raise SystemExit(f"duplicate final draft asset: {name}")
              if asset.get("state") != "uploaded":
                  raise SystemExit(f"final draft asset is not uploaded: {name}")
              actual[name] = (asset.get("id"), asset.get("size"), asset.get("digest"))
          if actual != expected:
              raise SystemExit(f"draft assets changed after OCI verification: {actual!r}")
          PY

          {
            echo "### v0.2.0 recovery verification passed"
            echo
            echo "- Tag object: \`${EXPECTED_TAG_OBJECT}\`"
            echo "- Target commit: \`${EXPECTED_TARGET}\`"
            echo "- Draft release id: \`${EXPECTED_RELEASE_ID}\`"
            echo "- OCI digest: \`${EXPECTED_OCI_DIGEST}\`"
            echo "- Package SHA-256: \`${PKG_SHA256}\`"
            echo "- Package, Cosign bundle, DSSE SBOM, draft assets, and OCI bytes all matched."
            echo "- This workflow performed no tag move, package publication, signing, asset replacement, or Release-state mutation."
          } >> "${GITHUB_STEP_SUMMARY}"
