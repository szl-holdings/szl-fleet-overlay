#
# zarf-package-sign.yml — Zarf package build + keyless cosign signing
#
# Triggered by v0.2.0, whose target must be on protected main history.
# Zarf package and signs it keyless via GitHub OIDC (Sigstore Fulcio).
#
# Keyless signing:
#   - No cosign private key required in repository secrets
#   - The signing certificate identity is the workflow URL (OIDC claim)
#   - Transparency log entry created in Rekor (public audit)
#
# Verification:
#   cosign verify-blob \
#     --bundle zarf-package-szl-fleet-overlay-amd64-<version>.tar.zst.cosign.bundle \
#     --certificate-identity "https://github.com/szl-holdings/szl-fleet-overlay/.github/workflows/zarf-package-sign.yml@refs/tags/v0.2.0" \
#     --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
#     zarf-package-szl-fleet-overlay-amd64-<version>.tar.zst
#
# Refs:
#   Zarf v0.77.0: https://github.com/zarf-dev/zarf/releases/tag/v0.77.0
#   Keyless docs: https://docs.sigstore.dev/cosign/signing/keyless/
#   SZL_OPERATIONAL_UPGRADES.md U3 (P0, M)

name: Zarf Package Build + Sign

on:
  push:
    tags: [v0.2.0]

permissions:
  contents: read

env:
  ZARF_VERSION: "v0.77.0"
  ZARF_LINUX_AMD64_SHA256: 7e335ffe9861d6ce254d75b31fde9c96c0fa83469c82cd20228b27e63d18dd85
  COSIGN_VERSION: "v2.6.3"
  SYFT_VERSION: "v1.18.1"
  REGISTRY: "ghcr.io"
  ORG: "szl-holdings"
  PACKAGE_NAME: "szl-fleet-overlay"

concurrency:
  group: zarf-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-sign:
    name: Build & Sign Zarf Package
    if: github.ref == 'refs/tags/v0.2.0'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Durable GitHub Release assets
      id-token: write   # OIDC token exchange with Fulcio
      packages: write   # Publish the fleet package to GHCR

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require release commit on protected main history
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main \
            || { echo "Release tag target is not on origin/main"; exit 1; }

      - name: Inspect release recovery state
        id: release-state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          set +e
          release_probe=$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" 2>&1)
          release_status=$?
          set -e
          if [ "${release_status}" -eq 0 ]; then
            release=$(gh release view "${GITHUB_REF_NAME}" --json isDraft,tagName,targetCommitish)
            is_draft=$(jq -r '.isDraft' <<<"${release}")
            tag_name=$(jq -r '.tagName' <<<"${release}")
            target=$(jq -r '.targetCommitish' <<<"${release}")
            test "${is_draft}" = "true" \
              || { echo "Published release ${GITHUB_REF_NAME} already exists; refusing overwrite"; exit 1; }
            test "${tag_name}" = "${GITHUB_REF_NAME}" \
              || { echo "Draft release tag mismatch: ${tag_name}"; exit 1; }
            test "${target}" = "${GITHUB_SHA}" \
              || { echo "Draft release target mismatch: ${target}"; exit 1; }
            echo "draft_exists=true" >> "${GITHUB_OUTPUT}"
            echo "Incomplete draft ${GITHUB_REF_NAME} exists; recovery may replace only its unpublished assets"
          elif printf '%s\n' "${release_probe}" | grep -Eqi \
            'HTTP 404|404 Not Found|gh: Not Found \(HTTP 404\)'; then
            echo "draft_exists=false" >> "${GITHUB_OUTPUT}"
            echo "Release ${GITHUB_REF_NAME} is explicitly absent"
          else
            printf '%s\n' "${release_probe}" >&2
            echo "Could not prove release ${GITHUB_REF_NAME} absent; refusing publication" >&2
            exit 1
          fi

      # ── Determine package version ─────────────────────────────────────────
      - name: Determine version
        id: version
        run: |
          set -euo pipefail
          CHART_VERSION=$(grep '^version:' chart/Chart.yaml | awk '{print $2}')
          ZARF_VERSION_DECLARED=$(grep -A6 '^metadata:' zarf.yaml | grep 'version:' | head -1 | awk '{gsub(/"/, "", $2); print $2}')
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "Invalid semver: ${VERSION}"; exit 1; }
          test "${VERSION}" = "${CHART_VERSION}"
          test "${VERSION}" = "${ZARF_VERSION_DECLARED}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Package version: ${VERSION}"

      # ── Install Zarf v0.77.0 ─────────────────────────────────────────────
      - name: Install Zarf
        run: |
          set -euo pipefail
          URL="https://github.com/zarf-dev/zarf/releases/download/${ZARF_VERSION}/zarf_${ZARF_VERSION}_Linux_amd64"
          curl -fSL --retry 3 --retry-delay 5 "${URL}" -o /usr/local/bin/zarf
          printf '%s  %s\n' "${ZARF_LINUX_AMD64_SHA256}" /usr/local/bin/zarf \
            | sha256sum --check --strict
          chmod +x /usr/local/bin/zarf
          file /usr/local/bin/zarf | grep -q ELF \
            || { echo "Downloaded Zarf asset is not an ELF executable"; exit 1; }
          zarf version

      # ── Install cosign ────────────────────────────────────────────────────
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Verify cosign
        run: cosign version

      # ── Install syft (SBOM generator) ─────────────────────────────────────
      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          syft-version: ${{ env.SYFT_VERSION }}

      # ── Log in to ghcr.io ─────────────────────────────────────────────────
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect OCI release recovery state
        id: oci-state
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          IMAGE_REF="${REGISTRY}/${ORG}/packages/${PACKAGE_NAME}:${VERSION}"
          set +e
          probe=$(docker manifest inspect "${IMAGE_REF}" 2>&1)
          probe_status=$?
          set -e

          if [ "${probe_status}" -eq 0 ]; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            echo "OCI release ${IMAGE_REF} already exists; recovery requires byte-for-byte parity"
            exit 0
          fi

          if printf '%s\n' "${probe}" | grep -Eqi \
            'manifest unknown|no such manifest|name unknown|repository name not known to registry'; then
            echo "exists=false" >> "${GITHUB_OUTPUT}"
            echo "OCI release reference is explicitly absent: ${IMAGE_REF}"
            exit 0
          fi

          printf '%s\n' "${probe}" >&2
          echo "Could not prove that ${IMAGE_REF} is absent; refusing publication" >&2
          exit 1

      - name: Require private DCP pull credentials
        env:
          DCP_PULL_TOKEN: ${{ secrets.DCP_PULL_TOKEN }}
          DCP_PULL_USERNAME: ${{ secrets.DCP_PULL_USERNAME }}
        run: |
          set -euo pipefail
          test -n "${DCP_PULL_USERNAME}" \
            || { echo "Missing DCP_PULL_USERNAME release secret"; exit 1; }
          test -n "${DCP_PULL_TOKEN}" \
            || { echo "Missing DCP_PULL_TOKEN release secret"; exit 1; }

      - name: Log in to GHCR for the private DCP image
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DCP_PULL_USERNAME }}
          password: ${{ secrets.DCP_PULL_TOKEN }}

      - name: Verify the Defensive Control Plane release signature
        if: steps.oci-state.outputs.exists == 'false'
        env:
          DCP_IMAGE: ghcr.io/szl-holdings/szl-defensive-control-plane@sha256:01f1fa2d3a4eb3cffb873f7393b64050df77f4383fa9d219163fa0be0bd6dce6
        run: |
          set -euo pipefail
          cosign verify "${DCP_IMAGE}" \
            --certificate-identity "https://github.com/szl-holdings/szl-defensive-control-plane/.github/workflows/release.yml@refs/tags/v0.4.0" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

      - name: Verify source checksum manifest
        if: steps.oci-state.outputs.exists == 'false'
        run: |
          set -euo pipefail
          python3 scripts/source_checksums.py check
          ! grep -q 'PLACEHOLDER' receipts/checksums.txt

      - name: Recover canonical assets from the draft release
        if: steps.oci-state.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          test "${{ steps.release-state.outputs.draft_exists }}" = "true" \
            || { echo "OCI exists without its protected draft release; refusing unsafe recovery"; exit 1; }
          mkdir -p dist
          gh release download "${GITHUB_REF_NAME}" --dir dist
          PKG_FILE="zarf-package-${PACKAGE_NAME}-amd64-${VERSION}.tar.zst"
          SBOM_FILE="${PKG_FILE%.tar.zst}.sbom.spdx.json"
          expected_assets=$(printf '%s\n' \
            "${PKG_FILE}" \
            "${PKG_FILE}.cosign.bundle" \
            "${PKG_FILE}.sbom.bundle" \
            "${SBOM_FILE}" | sort)
          actual_assets=$(find dist -maxdepth 1 -type f -printf '%f\n' | sort)
          test "${actual_assets}" = "${expected_assets}"
          cosign verify-blob \
            --bundle "dist/${PKG_FILE}.cosign.bundle" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/zarf-package-sign.yml@refs/tags/v0.2.0" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "dist/${PKG_FILE}"
          jq -e '.spdxVersion and .creationInfo' "dist/${SBOM_FILE}" >/dev/null
          echo "pkg_file=${PKG_FILE}" >> "$GITHUB_ENV"
          echo "sbom_file=${SBOM_FILE}" >> "$GITHUB_ENV"

      # ── Build Zarf package ────────────────────────────────────────────────
      - name: Build Zarf package
        if: steps.oci-state.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          zarf package create . \
            --confirm \
            --no-progress \
            --output-directory ./dist
          PKG=$(find dist -maxdepth 1 -type f -name "zarf-package-${PACKAGE_NAME}-amd64-*.tar.zst" -print -quit)
          test -n "${PKG}"
          echo "Built: ${PKG}"
          echo "pkg_file=$(basename "${PKG}")" >> "$GITHUB_ENV"

      # ── Generate SBOM ─────────────────────────────────────────────────────
      - name: Generate SBOM
        if: steps.oci-state.outputs.exists == 'false'
        run: |
          set -euo pipefail
          SBOM_FILE="dist/${pkg_file%.tar.zst}.sbom.spdx.json"
          syft . -o spdx-json --file "${SBOM_FILE}"
          echo "SBOM: ${SBOM_FILE}"
          echo "sbom_file=$(basename "${SBOM_FILE}")" >> "$GITHUB_ENV"

      # ── Keyless sign package blob ─────────────────────────────────────────
      # cosign sign-blob obtains a short-lived cert from Fulcio via GitHub OIDC.
      # The signing bundle (cert + signature + Rekor log entry) is written to
      # ${pkg_file}.cosign.bundle — no private key is stored anywhere.
      - name: Sign Zarf package (keyless)
        if: steps.oci-state.outputs.exists == 'false'
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          PKG="dist/${pkg_file}"
          BUNDLE="${PKG}.cosign.bundle"

          cosign sign-blob \
            --yes \
            --bundle "${BUNDLE}" \
            "${PKG}"

          echo "Signed: ${PKG}"
          echo "Bundle: ${BUNDLE}"

          CERT_IDENTITY="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/zarf-package-sign.yml@refs/tags/v0.2.0"
          CERT_ISSUER="https://token.actions.githubusercontent.com"
          cat >> "${GITHUB_STEP_SUMMARY}" <<SUMMARY
          ### Signed package

          \`\`\`bash
          cosign verify-blob \\
            --bundle dist/${pkg_file}.cosign.bundle \\
            --certificate-identity "${CERT_IDENTITY}" \\
            --certificate-oidc-issuer "${CERT_ISSUER}" \\
            dist/${pkg_file}
          \`\`\`
          SUMMARY

      # ── Attest SBOM (DSSE) ────────────────────────────────────────────────
      - name: Attest SBOM (keyless DSSE)
        if: steps.oci-state.outputs.exists == 'false'
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          PKG="dist/${pkg_file}"
          SBOM="dist/${sbom_file}"

          cosign attest-blob \
            --yes \
            --new-bundle-format=false \
            --predicate "${SBOM}" \
            --type spdxjson \
            --bundle "${PKG}.sbom.bundle" \
            "${PKG}"

          echo "SBOM attestation: ${PKG}.sbom.bundle"

      - name: Verify package and SBOM attestation bindings
        run: |
          set -euo pipefail
          PKG="dist/${pkg_file}"
          SBOM="dist/${sbom_file}"
          BUNDLE="${PKG}.sbom.bundle"
          CERT_IDENTITY="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/zarf-package-sign.yml@refs/tags/v0.2.0"
          CERT_ISSUER="https://token.actions.githubusercontent.com"

          cosign verify-blob-attestation \
            --bundle "${BUNDLE}" \
            --certificate-identity "${CERT_IDENTITY}" \
            --certificate-oidc-issuer "${CERT_ISSUER}" \
            --type spdxjson \
            "${PKG}"

          PKG="${PKG}" SBOM="${SBOM}" BUNDLE="${BUNDLE}" python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path


          def reject_nonfinite(value: str) -> None:
              raise ValueError(f"non-finite JSON value: {value}")


          def load_json_bytes(raw: bytes):
              return json.loads(raw, parse_constant=reject_nonfinite)


          package_path = Path(os.environ["PKG"])
          sbom_path = Path(os.environ["SBOM"])
          bundle_path = Path(os.environ["BUNDLE"])

          bundle = load_json_bytes(bundle_path.read_bytes())
          encoded_envelope = bundle.get("base64Signature")
          if not isinstance(encoded_envelope, str) or not encoded_envelope:
              raise SystemExit("SBOM bundle does not contain a legacy DSSE envelope")
          envelope = load_json_bytes(base64.b64decode(encoded_envelope, validate=True))
          if envelope.get("payloadType") != "application/vnd.in-toto+json":
              raise SystemExit("unexpected DSSE payload type")
          signatures = envelope.get("signatures")
          if not isinstance(signatures, list) or len(signatures) != 1:
              raise SystemExit("expected exactly one DSSE signature")
          encoded_statement = envelope.get("payload")
          if not isinstance(encoded_statement, str) or not encoded_statement:
              raise SystemExit("DSSE envelope has no statement payload")
          statement = load_json_bytes(base64.b64decode(encoded_statement, validate=True))
          sbom = load_json_bytes(sbom_path.read_bytes())

          package_digest = hashlib.sha256()
          with package_path.open("rb") as package_file:
              for chunk in iter(lambda: package_file.read(1024 * 1024), b""):
                  package_digest.update(chunk)
          expected_digest = package_digest.hexdigest()
          expected_subject = [{
              "name": package_path.name,
              "digest": {"sha256": expected_digest},
          }]
          if statement.get("_type") != "https://in-toto.io/Statement/v0.1":
              raise SystemExit("unexpected in-toto statement type")
          if statement.get("predicateType") != "https://spdx.dev/Document":
              raise SystemExit("unexpected SBOM predicate type")
          if statement.get("subject") != expected_subject:
              raise SystemExit("SBOM attestation subject does not bind the exact package")
          if statement.get("predicate") != sbom:
              raise SystemExit("signed SBOM predicate differs from the staged SPDX document")
          PY

      - name: Stage signed assets in a draft release before OCI publication
        if: steps.oci-state.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ steps.release-state.outputs.draft_exists }}" != "true" ]; then
            gh release create "${GITHUB_REF_NAME}" \
              --verify-tag \
              --target "${GITHUB_SHA}" \
              --draft \
              --title "SZL Fleet Overlay ${GITHUB_REF_NAME}" \
              --notes "Signed Zarf package, verification bundle, and SBOM attestation for ${GITHUB_SHA}."
          fi
          gh release upload "${GITHUB_REF_NAME}" \
            --clobber \
            "dist/${pkg_file}" \
            "dist/${pkg_file}.cosign.bundle" \
            "dist/${pkg_file}.sbom.bundle" \
            "dist/${sbom_file}"

      - name: Revalidate draft release immediately before OCI publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state=$(gh release view "${GITHUB_REF_NAME}" \
            --json isDraft,tagName,targetCommitish,assets)
          test "$(jq -r '.isDraft' <<<"${state}")" = "true"
          test "$(jq -r '.tagName' <<<"${state}")" = "${GITHUB_REF_NAME}"
          test "$(jq -r '.targetCommitish' <<<"${state}")" = "${GITHUB_SHA}"
          test "$(jq -r '.assets | length' <<<"${state}")" -eq 4

      - name: Log back in to GHCR for fleet publication
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify existing OCI bytes before recovery
        if: steps.oci-state.outputs.exists == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          OCI_REF="oci://${REGISTRY}/${ORG}/packages/${PACKAGE_NAME}:${VERSION}"
          mkdir -p readback
          zarf package pull "${OCI_REF}" --architecture amd64 --output-directory readback
          pulled=$(find readback -maxdepth 1 -type f \
            -name "zarf-package-${PACKAGE_NAME}-amd64-${VERSION}.tar.zst" -print -quit)
          test -n "${pulled}"
          test "$(find readback -maxdepth 1 -type f -name 'zarf-package-*.tar.zst' | wc -l)" -eq 1
          test "$(sha256sum "dist/${pkg_file}" | awk '{print $1}')" = \
            "$(sha256sum "${pulled}" | awk '{print $1}')" \
            || { echo "Existing OCI package differs from the protected draft asset; refusing recovery"; exit 1; }

      # ── Publish to OCI registry ───────────────────────────────────────────
      - name: Reconfirm OCI release reference remains absent
        if: steps.oci-state.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          IMAGE_REF="${REGISTRY}/${ORG}/packages/${PACKAGE_NAME}:${VERSION}"
          set +e
          probe=$(docker manifest inspect "${IMAGE_REF}" 2>&1)
          probe_status=$?
          set -e

          if [ "${probe_status}" -eq 0 ]; then
            echo "OCI release ${IMAGE_REF} appeared after the initial check; refusing overwrite" >&2
            exit 1
          fi

          if printf '%s\n' "${probe}" | grep -Eqi \
            'manifest unknown|no such manifest|name unknown|repository name not known to registry'; then
            echo "OCI release reference is still explicitly absent immediately before publication: ${IMAGE_REF}"
            exit 0
          fi

          printf '%s\n' "${probe}" >&2
          echo "Could not reconfirm that ${IMAGE_REF} is absent; refusing publication" >&2
          exit 1

      - name: Publish to GHCR
        if: steps.oci-state.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          PKG="dist/${pkg_file}"
          OCI_REF="oci://${REGISTRY}/${ORG}/packages/${PACKAGE_NAME}:${VERSION}"
          zarf package publish "${PKG}" "oci://${REGISTRY}/${ORG}/packages" \
            --no-progress
          echo "Published: ${OCI_REF}"

      - name: Read back and verify the published OCI package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          OCI_REF="oci://${REGISTRY}/${ORG}/packages/${PACKAGE_NAME}:${VERSION}"
          rm -rf readback
          pulled_ok=false
          for attempt in 1 2 3 4 5; do
            rm -rf readback
            mkdir -p readback
            if zarf package pull "${OCI_REF}" \
              --architecture amd64 \
              --output-directory readback; then
              pulled_ok=true
              break
            fi
            if [ "${attempt}" -lt 5 ]; then
              sleep "$((attempt * 3))"
            fi
          done
          test "${pulled_ok}" = "true"
          pulled=$(find readback -maxdepth 1 -type f -name "zarf-package-${PACKAGE_NAME}-amd64-${VERSION}.tar.zst" -print -quit)
          test -n "${pulled}"
          test "$(find readback -maxdepth 1 -type f -name 'zarf-package-*.tar.zst' | wc -l)" -eq 1
          test "$(sha256sum "dist/${pkg_file}" | awk '{print $1}')" = "$(sha256sum "${pulled}" | awk '{print $1}')"
          cosign verify-blob \
            --bundle "dist/${pkg_file}.cosign.bundle" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/zarf-package-sign.yml@refs/tags/v0.2.0" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${pulled}"

      # ── Upload artifacts ──────────────────────────────────────────────────
      - name: Upload signed artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zarf-package-signed
          retention-days: 14
          path: |
            dist/zarf-package-*.tar.zst
            dist/zarf-package-*.cosign.bundle
            dist/zarf-package-*.sbom.bundle
            dist/*.sbom.spdx.json

      - name: Publish durable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq '.isDraft')" = "true"
          expected_assets=$(printf '%s\n' \
            "${pkg_file}" \
            "${pkg_file}.cosign.bundle" \
            "${pkg_file}.sbom.bundle" \
            "${sbom_file}" | sort)
          actual_assets=$(gh release view "${GITHUB_REF_NAME}" --json assets \
            --jq '.assets[].name' | sort)
          test "${actual_assets}" = "${expected_assets}"
          mkdir -p release-readback
          gh release download "${GITHUB_REF_NAME}" --dir release-readback
          test "$(find release-readback -maxdepth 1 -type f | wc -l)" -eq 4
          for asset in \
            "${pkg_file}" \
            "${pkg_file}.cosign.bundle" \
            "${pkg_file}.sbom.bundle" \
            "${sbom_file}"; do
            test "$(sha256sum "dist/${asset}" | awk '{print $1}')" = \
              "$(sha256sum "release-readback/${asset}" | awk '{print $1}')"
          done
          gh release edit "${GITHUB_REF_NAME}" --draft=false
