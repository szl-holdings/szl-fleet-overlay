name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  yamllint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML files
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: {max: 200}}}" \
            zarf.yaml \
            uds-bundle.yaml \
            tasks.yaml \
            chart/Chart.yaml \
            chart/values.yaml \
            chart/values/dev.yaml \
            chart/values/staging.yaml \
            chart/values/prod.yaml \
            configs/packages/ \
            configs/workloads/ \
            configs/peat/ \
            uds-packages/ \
            receipts/doctrine-pin.yaml

  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.14.0

      - name: Helm lint (default values)
        run: helm lint ./chart

      - name: Helm lint (dev values)
        run: helm lint ./chart -f chart/values/dev.yaml

      - name: Helm lint (staging values)
        run: helm lint ./chart -f chart/values/staging.yaml

      - name: Helm lint (prod values)
        run: helm lint ./chart -f chart/values/prod.yaml

  zarf-lint:
    name: Zarf Dev Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Zarf
        run: |
          curl -sL https://github.com/zarf-dev/zarf/releases/download/v0.77.0/zarf_v0.77.0_Linux_amd64 \
            -o /usr/local/bin/zarf
          chmod +x /usr/local/bin/zarf

      - name: Zarf dev lint
        run: zarf dev lint .

  doctrine-check:
    name: Doctrine Pin Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify doctrine-pin.yaml contains correct values
        run: |
          set -euo pipefail
          PIN=$(grep 'pin:' receipts/doctrine-pin.yaml | awk '{print $2}' | tr -d '"')
          VERSION=$(grep 'version:' receipts/doctrine-pin.yaml | head -1 | awk '{print $2}' | tr -d '"')
          KERNEL=$(grep 'kernelCommit:' receipts/doctrine-pin.yaml | awk '{print $2}' | tr -d '"')
          echo "Doctrine version: ${VERSION}"
          echo "Pin: ${PIN}"
          echo "Kernel: ${KERNEL}"
          [ "${VERSION}" = "v11" ] || { echo "FAIL: wrong doctrine version ${VERSION}"; exit 1; }
          [ "${PIN}" = "749/14/163" ] || { echo "FAIL: wrong pin ${PIN}"; exit 1; }
          [ "${KERNEL}" = "c7c0ba17" ] || { echo "FAIL: wrong kernel commit ${KERNEL}"; exit 1; }
          echo "Doctrine pin OK"

      - name: Verify no forbidden framework references in chart and config YAML
        run: |
          set -euo pipefail
          # Scope: chart/ and configs/ only.
          # receipts/doctrine-pin.yaml is the compliance record that MUST list these as excluded.
          # ci.yml itself uses these as search terms and is not a workload manifest.
          # Docs (SECURITY.md, CONTRIBUTING.md, SZL_FLEET_OVERLAY_DESIGN.md) describe exclusions.
          FAIL=0
          DIRS="chart configs"
          for term in IronBank FedRAMP CMMC SWFT MissionOwner; do
            HITS=$(grep -rl "${term}" ${DIRS} --include="*.yaml" --include="*.yml" 2>/dev/null || true)
            if [ -n "${HITS}" ]; then
              echo "FAIL: forbidden term '${term}' found in workload manifests:"
              echo "${HITS}"
              FAIL=1
            fi
          done
          [ "${FAIL}" -eq 0 ] || exit 1

      - name: Verify immutable Defensive Control Plane image contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import yaml
          from pathlib import Path

          documents = list(yaml.safe_load_all(
              Path("configs/workloads/defensive-control-plane.yaml").read_text(encoding="utf-8")
          ))
          deployments = [doc for doc in documents if doc and doc.get("kind") == "Deployment"]
          assert len(deployments) == 1, f"expected one DCP Deployment, got {len(deployments)}"
          image = deployments[0]["spec"]["template"]["spec"]["containers"][0]["image"]
          pattern = r"^ghcr\.io/szl-holdings/szl-defensive-control-plane@sha256:[0-9a-f]{64}$"
          assert re.fullmatch(pattern, image), f"DCP image is not canonical and digest-only: {image}"
          assert image.endswith("@sha256:01f1fa2d3a4eb3cffb873f7393b64050df77f4383fa9d219163fa0be0bd6dce6")
          print(f"Immutable DCP image: {image}")
          PY

      - name: Verify DCP version and digest synchronization
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import yaml
          from pathlib import Path

          expected_version = "0.4.0"
          expected_revision = "cbb7bddf0b584987830617e68725e36e9ed27434"
          expected_digest = "sha256:01f1fa2d3a4eb3cffb873f7393b64050df77f4383fa9d219163fa0be0bd6dce6"
          values = yaml.safe_load(Path("chart/values.yaml").read_text(encoding="utf-8"))
          app = values["apps"]["defensiveControlPlane"]
          assert app["image"]["version"] == expected_version
          assert app["image"]["sourceRevision"] == expected_revision
          assert app["image"]["digest"] == expected_digest
          zarf = yaml.safe_load(Path("zarf.yaml").read_text(encoding="utf-8"))
          constants = {item["name"]: item["value"] for item in zarf["constants"]}
          assert constants["DCP_VERSION"] == expected_version
          assert constants["DCP_SOURCE_REVISION"] == expected_revision
          assert constants["DCP_IMAGE_DIGEST"] == expected_digest
          component = next(item for item in zarf["components"] if item["name"] == "szl-defensive-control-plane-workload")
          assert component["images"] == [f"ghcr.io/szl-holdings/szl-defensive-control-plane@{expected_digest}"]
          receipt = yaml.safe_load(Path("receipts/doctrine-pin.yaml").read_text(encoding="utf-8"))
          image = receipt["spec"]["images"][0]
          assert image["version"] == expected_version
          assert image["sourceRevision"] == expected_revision
          assert image["subject"].endswith("@" + expected_digest)
          print("DCP identity is synchronized across chart, Zarf, and receipt")
          PY

      - name: Verify deterministic source checksums
        run: |
          set -euo pipefail
          python3 scripts/source_checksums.py check
          echo "Chart and config manifests clean — no forbidden framework references"
