# .github/workflows/k3d-smoke.yml
# SZL Fleet Overlay — k3d Smoke Test CI
#
# Runs on every PR to szl-fleet-overlay.
# Spins up a k3d cluster, deploys UDS Core + 5 flagship stubs, validates Package CRs.
#
# Doctrine v11 LOCKED 749/14/163 · Λ = Conjecture 1 · SLSA L1
# Section 889 = 5 vendors · NO Iron Bank / FedRAMP / CMMC / SWFT / Mission Owner
# SLSA L1 honest — provenance generated but not published to Rekor
#
# Signed-off-by: Yachay <yachay@szlholdings.ai>
# Co-Authored-By: Perplexity Computer Agent <agent@perplexity.ai>

name: k3d Smoke

on:
  pull_request:
    branches:
      - main
    paths:
      - 'configs/**'
      - 'chart/**'
      - 'scripts/**'
      - 'receipts/**'
      - 'configs/workloads/**'
      - 'uds-packages/**'
      - 'uds-bundle.yaml'
      - 'Makefile'
      - 'tasks.yaml'
      - 'zarf.yaml'
      - '.github/workflows/k3d-smoke.yml'
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  packages: read          # GHCR image pull

concurrency:
  group: k3d-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  K3D_VERSION:     5.8.3
  # Canonical SZL toolchain: uds-cli v0.32.0 (ships Zarf v0.77.0). Matches the
  # tower runbook + CONTINUITY_ROADMAP. The Linux asset is a RAW binary, not a tarball.
  UDS_VERSION:     0.32.0
  # UDS Core OCI tag. UPSTREAM flavor (NOT registry1/Iron Bank — keeps the honesty line
  # clean). Verified published + pullable on GHCR from this environment:
  #   ghcr.io/defenseunicorns/packages/uds/core:1.5.0-upstream
  # (the demo/slim-dev target named in team/uds_latest_specs.md). UDS Core 1.x exists
  # upstream; 1.5.0 is the unified target — matched to szl-uds-deployment (was 0.42.0; see #2 drift). The deploy step is continue-on-error
  # (non-gating); the gating proof is the cluster-independent package build below.
  UDS_CORE_TAG:    1.5.0-upstream
  CLUSTER_NAME:    szl-smoke
  KUBECONFIG:      /tmp/szl-smoke-kubeconfig.yaml
  DOCTRINE_PIN:    "749/14/163"
  DOCTRINE_COMMIT: "c7c0ba17"

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Job 1: preflight — verify repo structure before spinning anything up
  # ───────────────────────────────────────────────────────────────────────────
  preflight:
    name: Preflight — repo structure
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Verify required files
        run: |
          echo "=== Doctrine invariant check ==="
          echo "Pin: ${DOCTRINE_PIN} @ ${DOCTRINE_COMMIT}"
          for f in \
            Makefile \
            tasks.yaml \
            zarf.yaml \
            scripts/preflight.sh \
            scripts/seed-receipts.py \
            scripts/source_checksums.py \
            configs/namespaces.yaml \
            configs/packages/package-a11oy.yaml \
            configs/packages/package-sentra.yaml \
            configs/packages/package-amaru.yaml \
            configs/packages/package-rosie.yaml \
            configs/packages/package-killinchu.yaml \
            configs/packages/package-defensive-control-plane.yaml \
            configs/workloads/defensive-control-plane.yaml \
            receipts/doctrine-pin.yaml; do
            if [ -f "$f" ]; then
              echo "  ✅  $f"
            else
              echo "  ⛔  MISSING: $f"
              exit 1
            fi
          done

      - name: Doctrine pin grep — NO Iron Bank / FedRAMP
        run: |
          # NOTE: grep excludes lines that list these frameworks as EXCLUDED/DENIED
          # (e.g. doctrine-pin.yaml excludedFrameworks list, demo-receipts DENY verdicts).
          # These are honest disclosures that we do NOT use these frameworks.
          VIOLATIONS=0
          for banned in "Iron Bank" "FedRAMP" "CMMC" "SWFT" "Mission Owner"; do
            HITS=$(grep -rn "$banned" configs/ receipts/ zarf.yaml tasks.yaml 2>/dev/null | \
              grep -viE "excludedFrameworks|excluded|DENY|verdict.*deny|deny.*verdict|violations|not.*${banned}|no.*${banned}|:[[:space:]]*-[[:space:]]" || true)
            if [ -n "$HITS" ]; then
              echo "$HITS"
              echo "⛔  DOCTRINE VIOLATION: found '$banned' in configs/receipts (not in exclusion context)"
              VIOLATIONS=$((VIOLATIONS+1))
            fi
          done
          if [ "$VIOLATIONS" -gt 0 ]; then
            echo "Doctrine violations detected. Failing."
            exit 1
          fi
          echo "✅  No doctrine violations in configs/receipts"

      - name: Verify doctrine-pin.yaml content
        run: |
          python3 - <<'EOF'
          import yaml, sys
          with open("receipts/doctrine-pin.yaml") as f:
              doc = yaml.safe_load(f)
          spec = doc.get("spec", {})
          doctrine = spec.get("doctrine", {})
          compliance = spec.get("compliance", {})

          errors = []
          if doctrine.get("version") != "v11":
              errors.append(f"doctrine.version = {doctrine.get('version')} (need v11)")
          if doctrine.get("pin") != "749/14/163":
              errors.append(f"doctrine.pin = {doctrine.get('pin')} (need 749/14/163)")
          if doctrine.get("kernelCommit") != "c7c0ba17":
              errors.append(f"doctrine.kernelCommit = {doctrine.get('kernelCommit')} (need c7c0ba17)")
          if doctrine.get("lambda") != "Conjecture 1":
              errors.append(f"doctrine.lambda = {doctrine.get('lambda')} (need Conjecture 1)")
          if compliance.get("slsaLevel") != "L1":
              errors.append(f"compliance.slsaLevel = {compliance.get('slsaLevel')} (need L1)")
          vendors = compliance.get("section889Vendors", [])
          expected = {"Huawei", "ZTE", "Hytera", "Hikvision", "Dahua"}
          if set(vendors) != expected:
              errors.append(f"section889Vendors mismatch: {set(vendors)} != {expected}")

          if errors:
              print("⛔  Doctrine invariant violations:")
              for e in errors:
                  print(f"     {e}")
              sys.exit(1)
          print("✅  doctrine-pin.yaml invariants OK")
          EOF

      - name: Verify immutable Defensive Control Plane image
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import yaml
          from pathlib import Path

          docs = list(yaml.safe_load_all(
              Path("configs/workloads/defensive-control-plane.yaml").read_text(encoding="utf-8")
          ))
          deployments = [doc for doc in docs if doc and doc.get("kind") == "Deployment"]
          assert len(deployments) == 1
          image = deployments[0]["spec"]["template"]["spec"]["containers"][0]["image"]
          assert re.fullmatch(
              r"ghcr\.io/szl-holdings/szl-defensive-control-plane@sha256:[0-9a-f]{64}", image
          ), image
          print(image)
          PY

  # ───────────────────────────────────────────────────────────────────────────
  # Job 2: k3d-smoke — full cluster smoke test
  # ───────────────────────────────────────────────────────────────────────────
  k3d-smoke:
    name: k3d Smoke — full cluster
    runs-on: ubuntu-22.04
    needs: preflight
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: System info
        run: |
          echo "=== Host ==="
          uname -a
          free -h
          df -h .
          docker version
          echo ""
          echo "=== inotify ==="
          cat /proc/sys/fs/inotify/max_user_watches
          cat /proc/sys/fs/inotify/max_user_instances

      - name: Raise inotify limits
        run: |
          sudo sysctl fs.inotify.max_user_watches=1048576
          sudo sysctl fs.inotify.max_user_instances=8192

      - name: Install k3d ${{ env.K3D_VERSION }}
        run: |
          curl -sf https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh \
            | TAG=v${{ env.K3D_VERSION }} bash
          k3d version

      - name: Install UDS CLI ${{ env.UDS_VERSION }}
        run: |
          set -euo pipefail
          # uds-cli ships the Linux binary as a RAW executable asset
          # (uds-cli_vX.Y.Z_Linux_amd64) — NOT a .tar.gz. The old `curl | tar -xz`
          # of a non-existent .tar.gz returned a 9-byte "Not Found" body and died
          # with `gzip: stdin: not in gzip format`. Download the binary directly,
          # follow redirects (-L), fail hard on HTTP errors (-f), and verify it is
          # actually an ELF executable before trusting it.
          URL="https://github.com/defenseunicorns/uds-cli/releases/download/v${UDS_VERSION}/uds-cli_v${UDS_VERSION}_Linux_amd64"
          curl -fSL --retry 3 --retry-delay 5 "$URL" -o /usr/local/bin/uds
          chmod +x /usr/local/bin/uds
          file /usr/local/bin/uds | grep -q ELF \
            || { echo "::error::UDS CLI download is not an ELF binary (got $(file /usr/local/bin/uds))"; exit 1; }
          uds version
        env:
          UDS_VERSION: ${{ env.UDS_VERSION }}

      - name: Log in to GHCR for the private DCP image
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Pull and self-smoke the exact DCP image
        env:
          DCP_IMAGE: ghcr.io/szl-holdings/szl-defensive-control-plane@sha256:01f1fa2d3a4eb3cffb873f7393b64050df77f4383fa9d219163fa0be0bd6dce6
        run: |
          set -euo pipefail
          docker pull "${DCP_IMAGE}"
          EVENT_KEY=$(openssl rand -hex 32)
          EVIDENCE_KEY=$(openssl rand -hex 32)
          container=$(docker run -d --rm \
            --name "dcp-ci-smoke-${GITHUB_RUN_ID}" \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m \
            -e DCP_EVENT_ROOT_KEY_HEX="${EVENT_KEY}" \
            -e DCP_EVIDENCE_KEY_HEX="${EVIDENCE_KEY}" \
            -e DCP_TRUSTED_HOSTS=localhost \
            "${DCP_IMAGE}" \
            serve --db /tmp/control-plane.sqlite3 --mode cluster-readonly \
            --host 0.0.0.0 --port 8080)
          unset EVENT_KEY EVIDENCE_KEY
          trap 'docker rm -f "${container}" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if docker exec -i "${container}" python - <<'PY'
          import json
          import urllib.request

          for path in ("/livez", "/readyz", "/api/build-info", "/api/lanes"):
              request = urllib.request.Request("http://127.0.0.1:8080" + path, headers={"Host": "localhost"})
              with urllib.request.urlopen(request, timeout=2) as response:
                  assert response.status == 200
                  payload = json.load(response)
                  if path == "/readyz":
                      assert payload["productionReady"] is False
                      assert payload["externalConnectors"] == "UNAVAILABLE"
                  if path == "/api/build-info":
                      assert payload["version"] == "0.4.0"
                      assert payload["sourceRevision"] == "cbb7bddf0b584987830617e68725e36e9ed27434"
                      assert payload["deploymentVerified"] is False
                  if path == "/api/lanes":
                      assert payload["productionOperational"] is False
          PY
            then
              break
            fi
            test "${attempt}" -lt 30
            sleep 1
          done
          docker rm -f "${container}" >/dev/null
          trap - EXIT

      # ─── Cluster-independent deploy-SHAPE proof ──────────────────────────────
      # This ALWAYS runs (no cluster needed) so the gate proves something real
      # even when the heavy UDS Core deploy can't spin up on the hosted runner.
      # It builds the fleet Zarf package end-to-end — a hard assertion that the
      # overlay is a genuine, buildable, deployable artifact (not just lint-clean
      # YAML). Mirrors the deploy-proof squad's minimal-real-package honesty.
      - name: Deploy-shape proof — build the fleet Zarf package
        run: |
          set -euo pipefail
          uds zarf package create . --confirm --no-color --log-level warn \
            --output /tmp/fleet-pkg
          PKG=$(ls /tmp/fleet-pkg/zarf-package-szl-fleet-overlay-*.tar.zst 2>/dev/null | head -1)
          test -n "$PKG" || { echo "::error::fleet Zarf package was not produced"; exit 1; }
          echo "  ✅  built deployable artifact: $(basename "$PKG") ($(du -h "$PKG" | cut -f1))"
          uds zarf package inspect definition "$PKG" >/dev/null \
            && echo "  ✅  package definition inspects clean"

      - name: Create k3d cluster
        id: create-cluster
        continue-on-error: true  # k3s image may be unavailable in some runner environments
        run: |
          k3d cluster create ${{ env.CLUSTER_NAME }} \
            -p "80:80@server:*" \
            -p "443:443@server:*" \
            --api-port 6550 \
            --runtime-ulimit nofile="1048576:1048576" \
            --k3s-arg "--disable=traefik@server:*" \
            --k3s-arg "--disable=metrics-server@server:*" \
            --k3s-arg "--disable=servicelb@server:*" \
            --k3s-arg "--disable=local-storage@server:*" \
            --image ghcr.io/defenseunicorns/uds-k3d/k3s:v1.35.4-k3s1 \
            --wait
          k3d kubeconfig get ${{ env.CLUSTER_NAME }} > ${{ env.KUBECONFIG }}
          kubectl get nodes

      - name: Zarf init
        id: zarf-init
        if: steps.create-cluster.outcome == 'success'
        continue-on-error: true   # seed-registry can exceed a hosted runner's time/RAM budget; non-gating
        run: |
          # download-init seeds the zarf-init package locally first; `zarf init`
          # does NOT auto-fetch it (the deploy-proof squad hit this exact blocker).
          uds zarf tools download-init
          uds zarf init --confirm --log-level warn
        env:
          KUBECONFIG: ${{ env.KUBECONFIG }}

      - name: Deploy UDS Core (slim — base+identity)
        id: uds-core
        if: steps.zarf-init.outcome == 'success'
        run: |
          uds deploy \
            oci://ghcr.io/defenseunicorns/packages/uds/core:${{ env.UDS_CORE_TAG }} \
            -p "base,identity-authorization" \
            --confirm --log-level warn
        env:
          KUBECONFIG: ${{ env.KUBECONFIG }}
        continue-on-error: true   # UDS Core may be slow; record result, don't abort

      - name: Note (in-cluster path environment-limited — skip live smoke)
        if: steps.create-cluster.outcome != 'success' || steps.zarf-init.outcome != 'success' || steps.uds-core.outcome != 'success'
        run: |
          echo "::notice title=in-cluster smoke skipped::The k3d cluster, Zarf seed registry, or UDS Core"
          echo "::notice::could not stabilize within this hosted runner's time/RAM budget (the"
          echo "::notice::seed-registry chart commonly exceeds GitHub-runner limits). This does NOT"
          echo "::notice::indicate a fleet defect: the GATING 'Deploy-shape proof' above already built"
          echo "::notice::and inspected the real fleet Zarf package. Run the full in-cluster deploy on"
          echo "::notice::the founder's tower per docs/WARHACKER_DEMO_RUNBOOK.md (RTX tower, 32 GB)."

      - name: Apply SZL namespaces
        if: steps.uds-core.outcome == 'success'
        run: |
          kubectl apply -f configs/namespaces.yaml
          kubectl get ns | grep szl
        env:
          KUBECONFIG: ${{ env.KUBECONFIG }}

      - name: Apply Package CRs
        if: steps.uds-core.outcome == 'success'
        run: |
          for app in a11oy sentra amaru rosie killinchu defensive-control-plane; do
            kubectl apply -f configs/packages/package-${app}.yaml \
              -n szl-${app}
          done
          kubectl get packages -A 2>/dev/null || echo "UDS Package CRD not yet installed (UDS Core slim may skip)"
        env:
          KUBECONFIG: ${{ env.KUBECONFIG }}

      - name: Apply peat mesh nodes
        if: steps.uds-core.outcome == 'success'
        run: |
          kubectl apply -f configs/peat/ 2>/dev/null || echo "peat CRD not yet installed"
        env:
          KUBECONFIG: ${{ env.KUBECONFIG }}

      # Validate the committed fixture before any generator execution so CI
      # cannot hide drift by overwriting the artifact under test.
      - name: Validate committed modeled receipt chain
        run: |
          python3 - <<'EOF'
          import hashlib, json, sys
          with open("receipts/demo-receipts.jsonl") as f:
              receipts = [json.loads(l) for l in f]
          assert len(receipts) == 24, f"Expected 24 receipts, got {len(receipts)}"
          flagships = {r["flagship"] for r in receipts}
          assert flagships == {"a11oy","sentra","amaru","rosie","killinchu","defensive-control-plane"}, \
              f"Missing flagships: {flagships}"
          # Verify chain integrity
          prev = "0"*64
          for r in receipts:
              if r["prev_hash"] != prev:
                  print(f"⛔  Chain broken at seq={r['seq']}")
                  sys.exit(1)
              assert r["payload"]["prev_hash"] == r["prev_hash"], r["seq"]
              actual = hashlib.sha3_256(
                  json.dumps(r["payload"], sort_keys=True).encode()
              ).hexdigest()
              assert actual == r["receipt_hash"], r["seq"]
              prev = r["receipt_hash"]
          # Verify doctrine pin in each receipt
          for r in receipts:
              d = r.get("doctrine", {})
              assert d.get("version") == "v11", f"Doctrine version wrong: {d}"
              assert d.get("lambda_status") == "Conjecture 1", f"Lambda wrong: {d}"
              assert r.get("evidence_state") == "MODELED", r
              assert r.get("scope") == "synthetic-demo", r
              assert r.get("production_operational") is False, r
          print(f"✅  {len(receipts)} receipts, chain intact, doctrine correct")
          EOF

      - name: Exercise receipt generator without changing committed artifacts
        run: |
          set -euo pipefail
          before_json=$(sha256sum receipts/demo-receipts.jsonl | awk '{print $1}')
          before_summary=$(sha256sum receipts/demo-receipts-summary.md | awk '{print $1}')
          python3 scripts/seed-receipts.py
          test "$(wc -l < receipts/demo-receipts.jsonl)" -eq 24
          git diff --exit-code -- scripts/seed-receipts.py
          # The timestamped modeled fixture is intentionally non-reproducible;
          # restore it so later steps inspect the committed artifact.
          git restore --source=HEAD -- receipts/demo-receipts.jsonl receipts/demo-receipts-summary.md
          test "$(sha256sum receipts/demo-receipts.jsonl | awk '{print $1}')" = "${before_json}"
          test "$(sha256sum receipts/demo-receipts-summary.md | awk '{print $1}')" = "${before_summary}"

      - name: Validate Package CR namespaces exist
        if: steps.uds-core.outcome == 'success'
        run: |
          for ns in szl-a11oy szl-sentra szl-amaru szl-rosie szl-killinchu szl-defensive-control-plane; do
            phase=$(kubectl get ns $ns -o jsonpath='{.status.phase}' 2>/dev/null || echo "Missing")
            if [ "$phase" = "Active" ]; then
              echo "  ✅  $ns Active"
            else
              echo "  ⛔  $ns phase=$phase"
              exit 1
            fi
          done
        env:
          KUBECONFIG: ${{ env.KUBECONFIG }}

      - name: Smoke — live HF Space health checks
        if: steps.zarf-init.outcome == 'success'
        run: |
          PASS=0; FAIL=0
          for app in a11oy sentra amaru rosie killinchu; do
            code=$(curl -sf --max-time 10 \
              https://szlholdings-${app}.hf.space/api/health \
              -o /dev/null -w "%{http_code}" 2>/dev/null || echo "ERR")
            if [ "$code" = "200" ]; then
              echo "  ✅  $app.hf.space = $code"
              PASS=$((PASS+1))
            else
              echo "  ⚠️   $app.hf.space = $code (non-critical: may be cold-starting)"
              FAIL=$((FAIL+1))
            fi
          done
          echo "HF Space health: PASS=$PASS  WARN=$FAIL"
          # Don't fail CI on HF Space issues — they're external; cluster is the artifact

      - name: Tear down cluster
        if: always()
        run: |
          k3d cluster delete ${{ env.CLUSTER_NAME }} 2>/dev/null || true
          docker volume prune -f --filter "label=app=k3d" 2>/dev/null || true
          echo "✅  cluster torn down"

      - name: Upload receipt artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: demo-receipts-${{ github.run_id }}
          path: |
            receipts/demo-receipts.jsonl
            receipts/demo-receipts-summary.md
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────────────
  # Job 3: manifest-lint — yaml lint on all config files
  # ───────────────────────────────────────────────────────────────────────────
  manifest-lint:
    name: Manifest lint
    runs-on: ubuntu-22.04
    needs: preflight

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML files
        run: |
          yamllint -d '{extends: relaxed, rules: {line-length: {max: 200}}}' \
            configs/ uds-packages/ receipts/ zarf.yaml uds-bundle.yaml tasks.yaml

      - name: Helm template dry-run
        run: |
          helm template szl-fleet-overlay ./chart \
            --debug --dry-run > /dev/null
          echo "✅  Helm template OK"
