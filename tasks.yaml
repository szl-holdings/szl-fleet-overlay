# SZL Fleet Overlay — Maru Task Runner
# Doctrine v11 LOCKED 749/14/163 at kernel commit c7c0ba17
# Inner loop registers five pre-existing flagships and deploys the Defensive Control Plane.

includes:
  - actions: https://raw.githubusercontent.com/defenseunicorns/uds-common/refs/tags/v1.24.9/tasks/actions.yaml

variables:
  - name: VERSION
    default: "0.2.0"
  - name: ARCH
    default: "amd64"
  - name: REGISTRY
    default: "ghcr.io/szl-holdings"
  - name: CLUSTER_NAME
    default: "szl-local"
  - name: DOMAIN
    default: "uds.dev"
  # Managed Package CRs (space-separated, ordered by dependency)
  - name: FLAGSHIP_ORDER
    default: "a11oy sentra amaru rosie killinchu defensive-control-plane"

###############################################################################
# DEFAULT — build + local registration/deploy                                #
###############################################################################
tasks:
  - name: default
    description: "Build + local registration/DCP deploy (alias for: build → dev)"
    actions:
      - task: build
      - task: dev

###############################################################################
# INNER LOOP — register five pre-existing flagships and deploy DCP            #
###############################################################################
  - name: dev
    description: |
      Inner-loop developer workflow.
      Prerequisites: k3d, kubectl, uds CLI (>=0.32.0), helm, cosign,
      and the precreated DCP signing-key Secret documented in README.md.
      What it does:
        1. Ensures a k3d cluster named ${CLUSTER_NAME} exists
        2. Installs UDS Core (lightweight) if not present
        3. Creates SZL namespaces
        4. Registers five pre-existing flagship workloads and deploys the Defensive Control Plane
        5. Validates all managed Package CRs and the DCP read-only status runtime
        6. Prints the service URLs for local smoke-testing
    actions:
      - task: cluster-up
      - task: uds-core-ensure
      - task: build
      - task: deploy-all

  - name: dev-quick
    description: "Re-deploy only — skip cluster bring-up and UDS Core (assumes cluster already running)"
    actions:
      - task: build
      - task: deploy-all

###############################################################################
# CLUSTER LIFECYCLE                                                            #
###############################################################################
  - name: cluster-up
    description: "Create k3d cluster ${CLUSTER_NAME} if it does not exist"
    actions:
      - cmd: |
          if k3d cluster list 2>/dev/null | grep -q "${CLUSTER_NAME}"; then
            echo "✓ k3d cluster '${CLUSTER_NAME}' already running"
          else
            echo "→ Creating k3d cluster '${CLUSTER_NAME}' …"
            k3d cluster create "${CLUSTER_NAME}" \
              --servers 1 \
              --agents 2 \
              --port "443:443@loadbalancer" \
              --port "80:80@loadbalancer" \
              --k3s-arg "--disable=traefik@server:0" \
              --wait
            echo "✓ k3d cluster '${CLUSTER_NAME}' created"
          fi
        description: "Ensure k3d cluster exists"

  - name: cluster-down
    description: "Tear down k3d cluster ${CLUSTER_NAME}"
    actions:
      - cmd: k3d cluster delete "${CLUSTER_NAME}"
        description: "Delete k3d cluster"

  - name: cluster-reset
    description: "Full reset — tear down then bring up fresh cluster (data loss)"
    actions:
      - task: cluster-down
      - task: cluster-up

###############################################################################
# UDS CORE                                                                    #
###############################################################################
  - name: uds-core-ensure
    description: |
      Install UDS Core (k3d lightweight bundle) if not already present.
      Skips if the uds-operator deployment already exists in uds namespace.
    actions:
      - cmd: |
          if kubectl get deployment uds-operator -n uds 2>/dev/null | grep -q uds-operator; then
            echo "✓ UDS Core already installed"
          else
            echo "→ Installing UDS Core (k3d dev bundle) …"
            uds deploy k3d-core:latest --confirm
            echo "✓ UDS Core installed"
          fi
        description: "Ensure UDS Core is installed"

###############################################################################
# BUILD                                                                       #
###############################################################################
  - name: build
    description: "Build the szl-fleet-overlay Zarf package"
    actions:
      - cmd: uds zarf package create . -a ${ARCH} --confirm --skip-sbom
        description: "Create szl-fleet-overlay Zarf package"

  - name: build-with-sbom
    description: "Build the Zarf package with SBOM generation (SLSA L1)"
    actions:
      - cmd: uds zarf package create . -a ${ARCH} --confirm
        description: "Create szl-fleet-overlay Zarf package with SBOM"

###############################################################################
# SIGN / RECEIPTS                                                             #
###############################################################################
  - name: sign-receipts
    description: |
      Regenerate and verify the deterministic source checksum manifest.
      The published Zarf artifact receives the release signature in CI.
    actions:
      - cmd: |
          set -euo pipefail
          python3 scripts/source_checksums.py write
          python3 scripts/source_checksums.py check
          echo "checksums.txt:"
          cat receipts/checksums.txt
        description: "Generate and verify source checksums"

  - name: verify-receipts
    description: "Verify deterministic source checksums"
    actions:
      - cmd: |
          set -euo pipefail
          python3 scripts/source_checksums.py check
          ! grep -q PLACEHOLDER receipts/checksums.txt
        description: "Verify source checksum manifest"

###############################################################################
# PUBLISH                                                                     #
###############################################################################
  - name: publish
    description: "Canonical publication is restricted to the v0.2.0 tag workflow"
    actions:
      - cmd: |
          echo "Canonical publication runs only from .github/workflows/zarf-package-sign.yml"
          echo "Create v0.2.0 only after the exact commit is merged to protected main."
          exit 1
        description: "Refuse local canonical publication"

###############################################################################
# DEPLOY                                                                      #
###############################################################################
  - name: deploy-local
    description: "Deploy szl-fleet-overlay to the local k3d cluster"
    actions:
      - task: validate-dcp-secrets
      - cmd: uds zarf package deploy zarf-package-szl-fleet-overlay-${ARCH}-*.tar.zst --confirm
        description: "Deploy fleet overlay"

  - name: validate-dcp-secrets
    description: "Fail closed unless the two distinct DCP signing keys exist"
    actions:
      - cmd: |
          set -euo pipefail
          namespace="szl-defensive-control-plane"
          signing_secret="szl-defensive-control-plane-signing-keys"
          kubectl get namespace "${namespace}" >/dev/null
          event_b64=$(kubectl get secret "${signing_secret}" -n "${namespace}" -o jsonpath='{.data.event-root-key-hex}')
          evidence_b64=$(kubectl get secret "${signing_secret}" -n "${namespace}" -o jsonpath='{.data.evidence-key-hex}')
          test -n "${event_b64}"
          test -n "${evidence_b64}"
          event_key=$(printf '%s' "${event_b64}" | base64 -d)
          evidence_key=$(printf '%s' "${evidence_b64}" | base64 -d)
          case "${event_key}" in *[!0-9a-f]*|'') exit 1 ;; esac
          case "${evidence_key}" in *[!0-9a-f]*|'') exit 1 ;; esac
          test "${#event_key}" -eq 64
          test "${#evidence_key}" -eq 64
          test "${event_key}" != "${evidence_key}"
        description: "Require two valid and distinct DCP signing keys"

  - name: deploy-all
    description: |
      Coordinated Package-CR registration and DCP deploy after Secret bootstrap.
      Assumes cluster is up and UDS Core is installed.
      Registers every managed Package CR and deploys the DCP workload.
    actions:
      - task: deploy-local
      - task: validate
      - task: urls

###############################################################################
# VALIDATE                                                                    #
###############################################################################
  - name: validate
    description: "Validate all managed Package CRs and the DCP runtime"
    actions:
      - cmd: |
          set -euo pipefail
          echo "▶ Waiting for Package CRs to reach Ready …"
          FAIL=0
          for app in ${FLAGSHIP_ORDER}; do
            # Poll up to 5 minutes (30s × 10)
            for i in $(seq 1 10); do
              phase=$(kubectl get package szl-${app} -n szl-${app} -o jsonpath='{.status.phase}' 2>/dev/null || echo "NotFound")
              if [ "${phase}" = "Ready" ]; then
                echo "  ✓ szl-${app} → Ready"
                break
              fi
              if [ "${i}" = "10" ]; then
                echo "  ✗ szl-${app} → ${phase} (TIMEOUT)"
                FAIL=1
              else
                echo "  … szl-${app} → ${phase} (attempt ${i}/10, retry in 30s)"
                sleep 30
              fi
            done
          done
          kubectl rollout status deployment/szl-defensive-control-plane \
            -n szl-defensive-control-plane --timeout=300s
          dcp_pod=$(kubectl get pod -n szl-defensive-control-plane \
            -l app=szl-defensive-control-plane -o jsonpath='{.items[0].metadata.name}')
          dcp_image_id=$(kubectl get pod -n szl-defensive-control-plane "${dcp_pod}" \
            -o jsonpath='{.status.containerStatuses[?(@.name=="defensive-control-plane")].imageID}')
          case "${dcp_image_id}" in
            *sha256:01f1fa2d3a4eb3cffb873f7393b64050df77f4383fa9d219163fa0be0bd6dce6*) ;;
            *) echo "Unexpected DCP imageID: ${dcp_image_id}"; exit 1 ;;
          esac
          kubectl exec -i -n szl-defensive-control-plane "${dcp_pod}" -- python - <<'PY'
          import json
          import urllib.request

          def get(path):
              request = urllib.request.Request(
                  "http://127.0.0.1:8080" + path,
                  headers={"Host": "szl-defensive-control-plane"},
              )
              with urllib.request.urlopen(request, timeout=3) as response:
                  assert response.status == 200
                  return json.load(response)

          ready = get("/readyz")
          build = get("/api/build-info")
          lanes = get("/api/lanes")
          assert ready["productionReady"] is False
          assert ready["externalConnectors"] == "UNAVAILABLE"
          assert build["version"] == "0.4.0"
          assert build["sourceRevision"] == "cbb7bddf0b584987830617e68725e36e9ed27434"
          assert build["deploymentVerified"] is False
          assert lanes["productionOperational"] is False
          PY
          if [ "${FAIL}" = "1" ]; then
            echo ""
            echo "✗ One or more Package CRs failed to reach Ready"
            exit 1
          fi
          echo ""
          echo "All managed Package CRs are Ready and DCP runtime checks passed"
        description: "Poll Package CRs for Ready status"

  - name: validate-doctrine
    description: "Verify doctrine pin invariants in the deployed receipts"
    actions:
      - cmd: |
          echo "▶ Checking doctrine pin in deployed receipt …"
          PIN=$(kubectl exec -n szl-a11oy \
            $(kubectl get pod -n szl-a11oy -l app=szl-a11oy -o jsonpath='{.items[0].metadata.name}' 2>/dev/null) \
            -- cat /var/szl/receipts/doctrine-pin.yaml 2>/dev/null || \
            cat receipts/doctrine-pin.yaml 2>/dev/null)
          echo "${PIN}"
          # Check doctrine version
          if echo "${PIN}" | grep -q "version: v11"; then
            echo "✓ doctrine version: v11"
          else
            echo "✗ doctrine version mismatch — expected v11"
            exit 1
          fi
          # Check pin
          if echo "${PIN}" | grep -q "749"; then
            echo "✓ doctrine pin: 749/14/163"
          else
            echo "✗ doctrine pin mismatch — expected 749/14/163"
            exit 1
          fi
          echo "✓ Doctrine invariants confirmed"
        description: "Verify deployed doctrine-pin.yaml matches v11 LOCKED"

###############################################################################
# UTILITY                                                                     #
###############################################################################
  - name: urls
    description: "Print local service URLs for managed fleet surfaces"
    actions:
      - cmd: |
          echo ""
          echo "▶ SZL Flagship Service URLs (local k3d)"
          echo "  Domain: ${DOMAIN}"
          echo ""
          for app in ${FLAGSHIP_ORDER}; do
            svc=$(kubectl get svc -n szl-${app} -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "(not found)")
            echo "  szl-${app}:"
            echo "    k8s service: ${svc}.szl-${app}.svc.cluster.local"
            if [ "${app}" = "defensive-control-plane" ]; then
              echo "    cluster-only: http://${svc}.szl-${app}.svc.cluster.local:8080/readyz"
            else
              echo "    ingress:     https://${app}.${DOMAIN}/api/${app}/v1/health"
            fi
          done
          echo ""
          echo "  Tip: add '127.0.0.1  *.${DOMAIN}' to /etc/hosts for local DNS"

  - name: logs
    description: "Stream logs from managed fleet surfaces"
    actions:
      - cmd: |
          for app in ${FLAGSHIP_ORDER}; do
            pod=$(kubectl get pod -n szl-${app} -l app=szl-${app} -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
            if [ -n "${pod}" ]; then
              kubectl logs -n szl-${app} "${pod}" -f --tail=50 &
              echo "→ tailing szl-${app} (${pod})"
            else
              echo "→ szl-${app}: no pod found (skip)"
            fi
          done
          echo ""
          echo "Streaming logs (Ctrl-C to stop) …"
          wait

  - name: status
    description: "Print status of all managed fleet surfaces"
    actions:
      - cmd: |
          echo "▶ SZL Fleet Status"
          echo ""
          for app in ${FLAGSHIP_ORDER}; do
            echo "─── szl-${app} ───"
            kubectl get all -n szl-${app} 2>/dev/null || echo "  (namespace not found)"
            phase=$(kubectl get package szl-${app} -n szl-${app} -o jsonpath='{.status.phase}' 2>/dev/null || echo "NotFound")
            echo "  Package CR phase: ${phase}"
            echo ""
          done

  - name: clean
    description: "Remove five demo flagships; preserve the DCP namespace and evidence PVC"
    actions:
      - cmd: |
          for app in a11oy sentra amaru rosie killinchu; do
            kubectl delete package szl-${app} -n szl-${app} --ignore-not-found=true
            kubectl delete namespace szl-${app} --ignore-not-found=true
            echo "✓ Removed szl-${app}"
          done
          kubectl delete namespace szl-system --ignore-not-found=true
          echo "Five demo flagships removed; DCP namespace and evidence PVC retained"
        description: "Delete SZL Package CRs and namespaces"

  - name: help
    description: "List all available tasks"
    actions:
      - cmd: |
          echo "SZL Fleet Overlay — Maru Task Runner"
          echo "Doctrine v11 LOCKED 749/14/163 · Λ Conjecture 1 · SLSA L1"
          echo ""
          echo "QUICK START:"
          echo "  uds run dev          # requires the precreated DCP signing-key Secret"
          echo "  uds run deploy-all   # cluster, UDS Core, and DCP Secret must exist"
          echo ""
          echo "TASKS:"
          echo "  dev              Build/deploy/validate after DCP Secret bootstrap"
          echo "  dev-quick        Re-deploy only after DCP Secret bootstrap"
          echo "  cluster-up       Create k3d cluster"
          echo "  cluster-down     Delete k3d cluster"
          echo "  cluster-reset    Tear down + re-create cluster"
          echo "  uds-core-ensure  Install UDS Core if not present"
          echo "  build            Build Zarf package"
          echo "  build-with-sbom  Build with SBOM (SLSA L1)"
          echo "  sign-receipts    Generate + verify source checksums"
          echo "  verify-receipts  Verify source checksum manifest"
          echo "  publish          Refuse local canonical release publication"
          echo "  deploy-local     Deploy package to local cluster"
          echo "  deploy-all       Register flagship CRs and deploy DCP"
          echo "  validate         Verify Package CRs, DCP rollout, digest, and status API"
          echo "  validate-doctrine Check doctrine pin in deployed receipts"
          echo "  urls             Print local service URLs"
          echo "  logs             Stream logs from all flagships"
          echo "  status           Print cluster resource status"
          echo "  clean            Remove five demo flagships; preserve DCP evidence"
          echo "  help             Show this help"
